name: Build Stratechna Social

# Sem rebuild agendado: a versão do Postiz está fixa no Dockerfile e só muda
# de propósito. O workflow upstream.yml abre um issue quando sai versão nova.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGEM: ghcr.io/stratechna/stratechna-social

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Versão fixada do Postiz
        id: v
        run: |
          V=$(sed -nE 's/^ARG POSTIZ_VERSION=v?([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' Dockerfile)
          test -n "$V" || { echo "POSTIZ_VERSION não encontrada no Dockerfile"; exit 1; }
          echo "versao=$V" >> "$GITHUB_OUTPUT"
          echo "minor=${V%.*}" >> "$GITHUB_OUTPUT"

      - name: Libertar espaço (a imagem do Postiz é grande)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - name: Build (o aplicar.py falha se alguma troca deixar de encaixar)
        run: docker build --pull -t social:teste --label org.opencontainers.image.revision=${{ github.sha }} .

      - name: Verificar a marca na imagem construída
        run: bash branding/verificar.sh social:teste

      - name: Publicar (só chega aqui se a verificação passou)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in ${{ steps.v.outputs.versao }} ${{ steps.v.outputs.minor }} latest; do
            docker tag social:teste "$IMAGEM:$tag"
            docker push -q "$IMAGEM:$tag"
          done
